{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block content %}
  <header class="site-header"><div class="container header-inner">
    <a class="logo" href="{{ url_for('public.index') }}">Article Blog</a>
  </div></header>
  <main class="container">
    <h1>Search</h1>
    <form class="search-form" method="get" action="{{ url_for('public.search') }}">
      <input type="search" name="q" value="{{ q }}" placeholder="Search…">
    </form>
    <p>{{ total }} result(s) for "{{ q }}"</p>
    <div class="article-container list">
      {% for a in results %}
        <div class="article-card">
          <h2 class="article-title"><a href="{{ url_for('public.article', slug=a['slug']) }}">{{ a['title'] }}</a></h2>
          {% if a['excerpt'] %}<p class="article-excerpt">{{ a['excerpt'] }}</p>{% endif %}
        </div>
      {% else %}
        <p>No results.</p>
      {% endfor %}
    </div>
  </main>
{% endblock %}
